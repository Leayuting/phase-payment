                onChange={(e) => setDeptModal((m) => ({ ...m, data: { ...m.data, status: e.target.checked ? "active" : "disabled" } }))} />
              啟用狀態
            </label>
            <button className="btn btn-ink w-full" disabled={!deptModal.data.name || !deptModal.data.code}
              onClick={() => {
                if (deptModal.mode === "add") actions.addDept(deptModal.data);
                else actions.editDept(deptModal.data);
                setDeptModal(null);
              }}>
              {deptModal.mode === "add" ? "建立單位" : "儲存變更"}
            </button>
          </div>
        </Modal>
      )}

      {ltModal && (
        <Modal title={ltModal.mode === "add" ? "新增假別" : "編輯假別"} onClose={() => setLtModal(null)}>
          <div className="space-y-3">
            <input className="inp" value={ltModal.data.name} placeholder="假別名稱"
              onChange={(e) => setLtModal((m) => ({ ...m, data: { ...m.data, name: e.target.value } }))} />
            <input className="inp" value={ltModal.data.code} placeholder="代碼"
              onChange={(e) => setLtModal((m) => ({ ...m, data: { ...m.data, code: e.target.value } }))} />
            <input className="inp" value={ltModal.data.description} placeholder="說明"
              onChange={(e) => setLtModal((m) => ({ ...m, data: { ...m.data, description: e.target.value } }))} />
            <button className="btn btn-ink w-full" disabled={!ltModal.data.name}
              onClick={() => {
                if (ltModal.mode === "add") actions.addLeaveType(ltModal.data);
                else actions.editLeaveType(ltModal.data);
                setLtModal(null);
              }}>
              {ltModal.mode === "add" ? "建立假別" : "儲存變更"}
            </button>
          </div>
        </Modal>
      )}

      {editRec && (
        <Modal title={`異動打卡紀錄 · ${editRec.date}`} onClose={() => setEditRec(null)}>
          <div className="space-y-3">
            {editSessions.map((s, i) => (
              <div key={i} className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs" style={{ color: "#8B857C" }}>第 {i + 1} 段上班</label>
                  <input className="inp mt-1" value={s.in}
                    onChange={(e) => setEditSessions((arr) => arr.map((x, j) => (j === i ? { ...x, in: e.target.value } : x)))} />
                </div>
                <div>
                  <label className="text-xs" style={{ color: "#8B857C" }}>第 {i + 1} 段下班</label>
                  <input className="inp mt-1" value={s.out}
                    onChange={(e) => setEditSessions((arr) => arr.map((x, j) => (j === i ? { ...x, out: e.target.value } : x)))} />
                </div>
              </div>
            ))}
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>異動原因（必填）</label>
              <input className="inp mt-1" value={editReason} onChange={(e) => setEditReason(e.target.value)} placeholder="請說明異動依據" />
            </div>
            <button className="btn btn-brick w-full" disabled={!editReason}
              onClick={() => { actions.adminEdit(editRec, editSessions, editReason); setEditRec(null); }}>
              確認異動（保留原始紀錄）
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- 主程式 ---------- */
function PhaseAttendance() {
  const [session, setSession] = useState(undefined); // undefined = 尚未取得, null = 未登入
  const [me, setMe] = useState(null);
  const [meError, setMeError] = useState("");
  const [departments, setDepartments] = useState([]);
  const [leaveTypes, setLeaveTypes] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [records, setRecords] = useState([]);
  const [outings, setOutings] = useState([]);
  const [leaves, setLeaves] = useState([]);
  const [requests, setRequests] = useState([]);
  const [audit, setAudit] = useState([]);
  const [dayOffs, setDayOffs] = useState([]);
  const [monthLocks, setMonthLocks] = useState([]);
  const [teamToday, setTeamToday] = useState([]);
  const [now, setNow] = useState(new Date());
  const [lastSync, setLastSync] = useState("");
  const [syncStatus, setSyncStatus] = useState("connecting");
  const [page, setPage] = useState("home");
  const [toast, setToast] = useState("");

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (session === undefined) return;
    if (!session) { setMe(null); return; }
    (async () => {
      const { data, error } = await sb.from("employees").select("*, departments(name)").eq("auth_user_id", session.user.id).maybeSingle();
      if (error || !data) { setMeError("此帳號尚未綁定員工資料，請聯絡管理員"); setMe(null); return; }
      if (!data.active) { setMeError("此帳號已停用，請聯絡管理員"); await sb.auth.signOut(); setMe(null); return; }
      setMeError("");
      setMe(mapEmployee(data));
    })();
  }, [session]);

  const loadAll = useCallback(async () => {
    const ds = today();
    const [depR, ltR, empR, recR, outR, lvR, reqR, audR, doR, mlR, teamR] = await Promise.all([
      sb.from("departments").select("*").order("name"),
      sb.from("leave_types").select("*").order("created_at"),
      sb.from("employees").select("*, departments(name)").order("name"),
      sb.from("attendance_records").select("*").order("date", { ascending: false }).limit(600),
      sb.from("outings").select("*").order("date", { ascending: false }).limit(600),
      sb.from("leaves").select("*, approver:employees!leaves_approved_by_fkey(name,email), rejecter:employees!leaves_rejected_by_fkey(name,email)").order("applied_at", { ascending: false }),
      sb.from("correction_requests").select("*").order("created_at", { ascending: false }),
      sb.from("audit_log").select("*").order("created_at", { ascending: false }).limit(300),
      sb.from("day_off_schedule").select("*"),
      sb.from("day_off_month_locks").select("*"),
      sb.rpc("team_snapshot", { p_start: ds, p_end: ds }),
    ]);
    if (depR.data) setDepartments(depR.data.map(mapDept));
    if (ltR.data) setLeaveTypes(ltR.data.map(mapLeaveType));
    if (empR.data) setEmployees(empR.data.map(mapEmployee));
    if (recR.data) setRecords(recR.data.map(mapRecord));
    if (outR.data) setOutings(outR.data.map(mapOuting));
    if (lvR.data) setLeaves(lvR.data.map(mapLeave));
    if (reqR.data) setRequests(reqR.data.map(mapRequest));
    if (audR.data) setAudit(audR.data.map(mapAudit));
    if (doR.data) setDayOffs(doR.data.map(mapDayOff));
    if (mlR.data) setMonthLocks(mlR.data.map((r) => r.year_month));
    if (teamR.data) setTeamToday(teamR.data.map(buildViewRow));
    setLastSync(fmtTime(new Date()));
  }, []);

  useEffect(() => { if (me) loadAll(); }, [me, loadAll]);

  const reloadTimer = useRef(null);
  const scheduleReload = useCallback(() => {
    if (reloadTimer.current) clearTimeout(reloadTimer.current);
    reloadTimer.current = setTimeout(() => { loadAll(); }, 700);
  }, [loadAll]);

  useEffect(() => {
    if (!me) return;
    const channel = sb.channel("phase-attendance-sync");
    ["attendance_records", "outings", "leaves", "correction_requests", "employees", "departments", "leave_types", "day_off_schedule", "day_off_month_locks"].forEach((t) => {
      channel.on("postgres_changes", { event: "*", schema: "public", table: t }, scheduleReload);
    });
    channel.subscribe((status) => setSyncStatus(status));
    return () => { sb.removeChannel(channel); };
  }, [me?.id, scheduleReload]);

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 3000);
    return () => clearTimeout(t);
  }, [toast]);

  const ds = today();
  const myRec = me ? records.find((r) => r.userId === me.id && r.date === ds) || null : null;
  const myOutings = me ? outings.filter((o) => o.userId === me.id && o.date === ds) : [];
  const myLeavesToday = me ? leaves.filter((l) => l.userId === me.id && leaveCovers(l, ds) && l.status === "approved") : [];
  const view = teamToday;

  const log = (action, target, detail, actorLabel) =>
    sb.from("audit_log").insert({ actor_id: me.id, actor_label: actorLabel, action, target, detail: detail || "" });

  /* --- 員工操作 --- */
  const clockIn = async () => {
    const t = fmtTime(new Date());
    const pos = await getPosition();
    const exist = records.find((r) => r.userId === me.id && r.date === ds);
    let error;
    if (exist) {
      ({ error } = await sb.from("attendance_records").update({ sessions: [...exist.sessions, { in: t, out: null }] }).eq("id", exist.id));
    } else {
      ({ error } = await sb.from("attendance_records").insert({
        employee_id: me.id, date: ds, sessions: [{ in: t, out: null }],
        lat: pos?.lat ?? null, lng: pos?.lng ?? null, accuracy: pos?.accuracy ?? null,
      }));
    }
    if (error) { setToast("打卡失敗：" + error.message); return; }
    setToast("上班打卡完成");
    loadAll();
  };
  const clockOut = async () => {
    const rec = records.find((r) => r.userId === me.id && r.date === ds);
    if (!rec) return;
    const sessions = rec.sessions.map((s) => (!s.out ? { ...s, out: fmtTime(new Date()) } : s));
    const { error } = await sb.from("attendance_records").update({ sessions }).eq("id", rec.id);
    if (error) { setToast("打卡失敗：" + error.message); return; }
    setToast("下班打卡完成，辛苦了。如需再次上班可重新打卡");
    loadAll();
  };
  const outStart = async (destination, purpose, expectedEnd, category) => {
    const pos = await getPosition();
    const { error } = await sb.from("outings").insert({
      employee_id: me.id, date: ds, start_time: fmtTime(new Date()),
      expected_end: expectedEnd, destination, purpose, category: category || "general",
      depart_lat: pos?.lat ?? null, depart_lng: pos?.lng ?? null, depart_accuracy: pos?.accuracy ?? null,
    });
    if (error) { setToast("外出登記失敗：" + error.message); return; }
    setToast("外出登記完成");
    loadAll();
  };
  const outArrive = async () => {
    const o = outings.find((x) => x.userId === me.id && x.date === ds && !x.end);
    if (!o) return;
    const pos = await getPosition();
    const { error } = await sb.from("outings").update({
      arrive_lat: pos?.lat ?? null, arrive_lng: pos?.lng ?? null, arrive_accuracy: pos?.accuracy ?? null,
      arrived_at: new Date().toISOString(),
    }).eq("id", o.id);
    if (error) { setToast("操作失敗：" + error.message); return; }
    setToast("已記錄到達");
    loadAll();
  };
  const outEnd = async () => {
    const o = outings.find((x) => x.userId === me.id && x.date === ds && !x.end);
    if (!o) return;
    const pos = await getPosition();
    const { error } = await sb.from("outings").update({
      end_time: fmtTime(new Date()),
      return_lat: pos?.lat ?? null, return_lng: pos?.lng ?? null, return_accuracy: pos?.accuracy ?? null,
      returned_at: new Date().toISOString(),
    }).eq("id", o.id);
    if (error) { setToast("操作失敗：" + error.message); return; }
    setToast("已完成返回，狀態恢復為已上班");
    loadAll();
  };
  const addDestination = async (outing, extraDest) => {
    const newDestination = `${outing.destination} → ${extraDest}`;
    const { error } = await sb.from("outings").update({ destination: newDestination }).eq("id", outing.id);
    if (error) { setToast("新增地點失敗：" + error.message); return; }
    setToast("已加入地點");
    loadAll();
  };
  const applyLeave = async (f) => {
    const { data, error } = await sb.from("leaves").insert({
      employee_id: me.id, leave_type_id: f.typeId, reason: f.reason,
      start_date: f.startDate, start_time: f.startTime, end_date: f.endDate, end_time: f.endTime,
      hours: f.hours, note: f.note,
    }).select().single();
    if (error) { setToast("送出失敗：" + error.message); return; }
    if (f.attachments?.length) {
      const uploaded = await uploadAttachments(f.attachments, me.authUserId, data.id);
      await sb.from("leaves").update({ attachments: uploaded }).eq("id", data.id);
    }
    setToast("請假申請已送出，狀態為待審核");
    loadAll();
  };
  const withdrawLeave = async (lv) => {
    const { error } = await sb.from("leaves").update({ status: "withdrawn", withdrawn_at: new Date().toISOString() }).eq("id", lv.id).eq("status", "pending");
    if (error) { setToast("撤回失敗：" + error.message); return; }
    setToast("已撤回申請，可重新提出");
    loadAll();
  };
  const addLeaveAttachment = async (leaveId, files) => {
    const lv = leaves.find((l) => l.id === leaveId);
    if (!lv) return;
    const uploaded = await uploadAttachments(files, me.authUserId, leaveId);
    const { error } = await sb.from("leaves").update({ attachments: [...(lv.attachments || []), ...uploaded] }).eq("id", leaveId);
    if (error) { setToast("上傳失敗：" + error.message); return; }
    await log("補上傳證明文件", `請假申請 ${leaveId}`, `新增 ${uploaded.length} 件`, me.name);
    setToast(`已上傳 ${uploaded.length} 件證明文件`);
    loadAll();
  };
  const submitCorrection = async (rec, sessionIdx, field, value, reason) => {
    const { error } = await sb.from("correction_requests").insert({
      employee_id: me.id, record_date: rec.date, session_idx: sessionIdx, field, value, reason,
    });
    if (error) { setToast("送出失敗：" + error.message); return; }
    setToast("更正申請已送出，待管理員審核");
    loadAll();
  };
  const changePw = async (npw) => {
    const { error } = await sb.auth.updateUser({ password: npw });
    setToast(error ? "密碼更新失敗：" + error.message : "密碼已更新");
  };
  const toggleDayOff = async (employeeId, ds, currentlyOff) => {
    if (monthLocks.includes(ds.slice(0, 7)) && me.role !== "admin") {
      setToast("本月排休已鎖定，如需異動請洽管理員"); return;
    }
    const onBehalf = employeeId !== me.id;
    const targetName = onBehalf ? (employees.find((u) => u.id === employeeId)?.name ?? employeeId) : me.name;
    const actorLabel = onBehalf ? `${me.name}（管理員）` : me.name;
    if (currentlyOff) {
      const row = dayOffs.find((o) => o.userId === employeeId && o.date === ds);
      if (!row) return;
      const { error } = await sb.from("day_off_schedule").delete().eq("id", row.id);
      if (error) { setToast("取消排休失敗：" + error.message); return; }
      await log(onBehalf ? "代員工取消排休" : "取消排休", targetName, ds, actorLabel);
    } else {
      const { error } = await sb.from("day_off_schedule").insert({ employee_id: employeeId, date: ds });
      if (error) { setToast("排休失敗：" + error.message); return; }
      await log(onBehalf ? "代員工新增排休" : "新增排休", targetName, ds, actorLabel);
    }
    loadAll();
  };
  const toggleMonthLock = async (yearMonth, locked) => {
    if (locked) {
      const { error } = await sb.from("day_off_month_locks").delete().eq("year_month", yearMonth);
      if (error) { setToast("解鎖失敗：" + error.message); return; }
      await log("解鎖排休", yearMonth, "", `${me.name}（管理員）`);
      setToast(`已解鎖 ${yearMonth}`);
    } else {
      const { error } = await sb.from("day_off_month_locks").insert({ year_month: yearMonth, locked_by: me.id });
      if (error) { setToast("鎖定失敗：" + error.message); return; }
      await log("鎖定排休", yearMonth, "", `${me.name}（管理員）`);
      setToast(`已鎖定 ${yearMonth}`);
    }
    loadAll();
  };

  /* --- 管理員操作 --- */
  const adminActions = {
    approveLeave: async (lv, note) => {
      const { error } = await sb.from("leaves").update({
        status: "approved", approved_by: me.id, approved_at: new Date().toISOString(), approval_note: note || "",
      }).eq("id", lv.id);
      if (error) { setToast("操作失敗：" + error.message); return; }
      await log("批准請假", `${lv.userId} ${lv.startDate} ${lv.startTime}～${lv.endDate} ${lv.endTime}`, `核准管理員：${me.name}${note ? `｜審核備註：${note}` : ""}`, `${me.name}（管理員）`);
      setToast(`已批准，核准管理員：${me.name}`); loadAll();
    },
    rejectLeave: async (lv, reasonTxt) => {
      const { error } = await sb.from("leaves").update({
        status: "rejected", rejected_by: me.id, rejected_at: new Date().toISOString(), rejection_reason: reasonTxt,
      }).eq("id", lv.id);
      if (error) { setToast("操作失敗：" + error.message); return; }
      await log("駁回請假", `${lv.userId} ${lv.startDate}～${lv.endDate}`, `駁回管理員：${me.name}｜原因：${reasonTxt}`, `${me.name}（管理員）`);
      setToast("已駁回並記錄原因"); loadAll();
    },
    addLeaveType: async (d) => {
      await sb.from("leave_types").insert({ name: d.name, code: d.code, description: d.description });
      await log("新增假別", d.name, `代碼 ${d.code}`, `${me.name}（管理員）`);
      loadAll();
    },
    editLeaveType: async (d) => {
      await sb.from("leave_types").update({ name: d.name, code: d.code, description: d.description }).eq("id", d.id);
      await log("編輯假別", d.name, "", `${me.name}（管理員）`);
      loadAll();
    },
    toggleLeaveType: async (id) => {
      const t = leaveTypes.find((x) => x.id === id);
      await sb.from("leave_types").update({ status: t.status === "active" ? "disabled" : "active" }).eq("id", id);
      await log(t.status === "active" ? "停用假別" : "啟用假別", t.name, "", `${me.name}（管理員）`);
      loadAll();
    },
    deleteLeaveType: async (id, inUse) => {
      if (inUse) { setToast("此假別已有請假紀錄使用，無法刪除，請改為停用"); return; }
      const t = leaveTypes.find((x) => x.id === id);
      await sb.from("leave_types").delete().eq("id", id);
      await log("刪除假別", t.name, "", `${me.name}（管理員）`);
      loadAll();
    },
    approveRequest: async (rq) => {
      const rec = records.find((r) => r.userId === rq.userId && r.date === rq.recordDate);
      if (!rec) { setToast("找不到對應的出勤紀錄"); return; }
      const before = rec.sessions[rq.sessionIdx]?.[rq.field] ?? null;
      const sessions = rec.sessions.map((s, i) => (i === rq.sessionIdx ? { ...s, [rq.field]: rq.value } : s));
      const history = [...rec.history, { time: nowStamp(), admin: me.name, reason: `更正申請核准：${rq.reason}`, sessionIdx: rq.sessionIdx, field: rq.field, before, after: rq.value }];
      await sb.from("attendance_records").update({ sessions, modified: true, history }).eq("id", rec.id);
      await sb.from("correction_requests").update({ status: "approved" }).eq("id", rq.id);
      await log("核准更正申請", `${rq.userId} ${rq.recordDate} 第${rq.sessionIdx + 1}段${rq.field === "in" ? "上班" : "下班"}時間`, `改為 ${rq.value}｜原因：${rq.reason}`, `${me.name}（管理員）`);
      setToast("已核准並補登"); loadAll();
    },
    rejectRequest: async (rq) => {
      await sb.from("correction_requests").update({ status: "rejected" }).eq("id", rq.id);
      await log("退回更正申請", `${rq.userId} ${rq.recordDate}`, `原因：${rq.reason}`, `${me.name}（管理員）`);
      loadAll();
    },
    adminEdit: async (rec, newSessions, reason) => {
      const hist = [...rec.history];
      newSessions.forEach((ns, i) => {
        ["in", "out"].forEach((f) => {
          const nv = ns[f] || null;
          const ov = rec.sessions[i]?.[f] ?? null;
          if (nv && nv !== ov) hist.push({ time: nowStamp(), admin: me.name, reason, sessionIdx: i, field: f, before: ov, after: nv });
        });
      });
      const changed = hist.length > rec.history.length;
      const sessions = rec.sessions.map((s, i) => ({ in: newSessions[i]?.in || s.in, out: newSessions[i]?.out || s.out }));
      await sb.from("attendance_records").update({ sessions, modified: changed ? true : rec.modified, history: hist }).eq("id", rec.id);
      await log("異動打卡紀錄", `${rec.userId} ${rec.date}`, `原因：${reason}`, `${me.name}（管理員）`);
      setToast("異動完成，原始紀錄已保留"); loadAll();
    },
    addStaff: async (d) => {
      const syntheticEmail = `${d.employeeCode}-${Date.now()}@phase-attendance.local`;
      const tempPassword = genTempPassword();
      const { userId: authUserId, error: signUpError } = await signUpEmployee(syntheticEmail, tempPassword);
      if (signUpError) { setToast("建立登入帳號失敗：" + signUpError); return; }
      const { error } = await sb.from("employees").insert({
        name: d.name, email: syntheticEmail, employee_code: d.employeeCode,
        department_id: d.departmentId, role: d.role || "staff", active: true, auth_user_id: authUserId,
      });
      if (error) { setToast("建立員工資料失敗：" + error.message); return; }
      await log(d.role === "admin" ? "新增管理員帳號" : "新增員工帳號", `${d.name}（${d.employeeCode}）`, "已自動建立登入帳號", `${me.name}（管理員）`);
      window.alert(`已建立 ${d.name} 的帳號（角色：${d.role === "admin" ? "管理員" : "員工"}）。\n\n員工代碼：${d.employeeCode}\n臨時密碼：${tempPassword}\n\n請把這組資訊告訴本人，登入後建議到「我的出勤」修改密碼。這組密碼只會顯示這一次，請先複製起來。`);
      setToast("帳號已建立");
      loadAll();
    },
    editStaff: async (d) => {
      await sb.from("employees").update({ name: d.name, employee_code: d.employeeCode, department_id: d.departmentId, role: d.role }).eq("id", d.id);
      await log("編輯員工資料", d.name, `代碼/單位/角色：${d.employeeCode}／${d.departmentId}／${d.role}`, `${me.name}（管理員）`);
      loadAll();
    },
    deleteStaff: async (uid, hasRec) => {
      const u = employees.find((x) => x.id === uid);
      if (hasRec) {
        if (!window.confirm(`${u?.name ?? "此員工"} 已有出勤／外出／請假／更正申請紀錄，永久刪除會連同這些歷史紀錄一起消失，無法復原。確定要刪除嗎？`)) return;
        if (!window.confirm("再次確認：這個動作無法復原，真的要永久刪除嗎？")) return;
      } else {
        if (!window.confirm(`確定要永久刪除 ${u?.name ?? "此員工"} 嗎？`)) return;
      }
      const { error } = await sb.from("employees").delete().eq("id", uid);
      if (error) { setToast("刪除失敗：" + error.message); return; }
      await log("刪除員工資料", u?.name ?? uid, hasRec ? "已連同歷史紀錄一併永久刪除" : "該員工無任何出勤紀錄", `${me.name}（管理員）`);
      setToast("已永久刪除"); loadAll();
    },
    toggleActive: async (uid) => {
      const u = employees.find((x) => x.id === uid);
      await sb.from("employees").update({ active: !u.active }).eq("id", uid);
      await log(u.active ? "停用帳號" : "啟用帳號", u.name, "", `${me.name}（管理員）`);
      loadAll();
    },
    resetPw: async (uid) => {
      const u = employees.find((x) => x.id === uid);
      const syntheticEmail = `${u.employeeCode}-${Date.now()}@phase-attendance.local`;
      const tempPassword = genTempPassword();
      const { userId: newAuthUserId, error } = await signUpEmployee(syntheticEmail, tempPassword);
      if (error) { setToast("重設失敗：" + error); return; }
      await sb.from("employees").update({ auth_user_id: newAuthUserId, email: syntheticEmail }).eq("id", uid);
      window.alert(`已重設 ${u.name} 的密碼。\n\n員工代碼：${u.employeeCode}\n新密碼：${tempPassword}\n\n請把這組資訊告訴本人，登入後建議修改密碼。這組密碼只會顯示這一次，請先複製起來。`);
      await log("重設密碼", u.name, "已建立新登入帳號取代舊的", `${me.name}（管理員）`);
      setToast("密碼已重設"); loadAll();
    },
    addDept: async (d) => {
      const { error } = await sb.from("departments").insert({ name: d.name, code: d.code, note: d.note, status: d.status });
      if (error) { setToast("建立失敗：" + error.message); return; }
      await log("新增單位", d.name, `代碼 ${d.code}`, `${me.name}（管理員）`);
      loadAll();
    },
    editDept: async (d) => {
      await sb.from("departments").update({ name: d.name, code: d.code, note: d.note, status: d.status }).eq("id", d.id);
      await log("編輯單位", d.name, "", `${me.name}（管理員）`);
      loadAll();
    },
    toggleDept: async (id, cnt) => {
      const d = departments.find((x) => x.id === id);
      if (d.status === "active" && cnt > 0) { setToast("此單位仍有員工，請先將員工移轉至其他單位。"); return; }
      await sb.from("departments").update({ status: d.status === "active" ? "disabled" : "active" }).eq("id", id);
      await log(d.status === "active" ? "停用單位" : "啟用單位", d.name, "", `${me.name}（管理員）`);
      loadAll();
    },
    deleteDept: async (id, cnt) => {
      if (cnt > 0) { setToast("此單位仍有員工，請先將員工移轉至其他單位。"); return; }
      const d = departments.find((x) => x.id === id);
      await sb.from("departments").delete().eq("id", id);
      await log("刪除單位", d.name, "", `${me.name}（管理員）`);
      loadAll();
    },
  };

  if (session === undefined || (session && !me && !meError)) {
    return (
      <div className="ph-root flex items-center justify-center min-h-screen">
        <div className="text-center">
          <div className="f-serif text-2xl font-bold tracking-widest">PHASE</div>
          <div className="text-sm mt-3" style={{ color: "#8B857C" }}>正在連線…</div>
        </div>
      </div>
    );
  }
  if (!session) return <Login />;
  if (meError) {
    return (
      <div className="ph-root flex items-center justify-center min-h-screen">
        <div className="text-center card p-8 max-w-sm">
          <div className="f-serif text-xl font-bold mb-3">PHASE</div>
          <div className="text-sm brick mb-4">{meError}</div>
          <button className="btn btn-line" onClick={() => sb.auth.signOut()}>登出</button>
        </div>
      </div>
    );
  }
  if (!me) return null;

  const navs = me.role === "admin"
    ? [["home", "出勤總覽"], ["calendar", "出勤行事曆"], ["dayoff", "排休"], ["admin", "管理後台"]]
    : [["home", "出勤總覽"], ["calendar", "出勤行事曆"], ["mine", "我的出勤"], ["leave", "請假申請"], ["dayoff", "排休"]];

  return (
    <div className="ph-root">
      <div className="max-w-6xl mx-auto px-2 sm:px-4 py-6 lg:flex lg:gap-8">
        <aside className="hidden lg:block lg:w-52 mb-6 lg:mb-0 shrink-0">
          <div className="mb-6">
            <div className="f-serif text-2xl font-bold tracking-widest">PHASE</div>
            <div className="text-xs" style={{ color: "#B3ADA4", letterSpacing: ".25em" }}>ATTENDANCE</div>
            <div className="text-xs mt-2" style={{ color: syncStatus === "SUBSCRIBED" ? "#2F6B43" : "#B3ADA4" }}>
              {syncStatus === "SUBSCRIBED" ? "● 即時同步中" : "○ 連線中"}
            </div>
          </div>
          <nav className="hidden lg:block">
            {navs.map(([k, l]) => (
              <button key={k} className={`navbtn ${page === k ? "on" : ""}`} style={{ width: "auto", minWidth: "max-content" }} onClick={() => setPage(k)}>{l}</button>
            ))}
          </nav>
          <div className="mt-6 pt-4 border-t hair text-sm hidden lg:block">
            <div className="font-medium">{me.name}</div>
            <div className="text-xs" style={{ color: "#8B857C" }}>{me.department} · {me.role === "admin" ? "管理員" : "員工"}</div>
            <button className="text-xs underline mt-2" style={{ color: "#8B857C" }} onClick={() => sb.auth.signOut()}>登出</button>
          </div>
        </aside>

        <main className="flex-1 space-y-6 min-w-0 pb-20 lg:pb-0">
          <div className="flex lg:hidden items-center justify-between text-sm">
            <div>
              <span className="f-serif font-bold tracking-widest">PHASE</span>
              <span className="ml-2" style={{ color: "#8B857C" }}>{me.name} · {me.department}</span>
            </div>
            <button className="text-xs underline" style={{ color: "#8B857C" }} onClick={() => sb.auth.signOut()}>登出</button>
          </div>

          {page === "home" && (
            <>
              {me.role !== "admin" && (
                <ClockCard me={me} myRec={myRec} myOutings={myOutings} myLeavesToday={myLeavesToday} now={now} departments={departments}
                  onClockIn={clockIn} onClockOut={clockOut} onOutStart={outStart} onOutEnd={outEnd} onAddDestination={addDestination} onOutArrive={outArrive} />
              )}
              <TeamBoard view={view} lastSync={lastSync} syncStatus={syncStatus} dayOffs={dayOffs} />
            </>
          )}
          {page === "calendar" && (
            <CalendarView me={me} users={employees} leaves={leaves} leaveTypes={leaveTypes} dayOffs={dayOffs} />
          )}
          {page === "mine" && me.role !== "admin" && (
            <MyAttendance me={me} records={records} outings={outings} onCorrection={submitCorrection} onChangePw={changePw} />
          )}
          {page === "leave" && me.role !== "admin" && (
            <LeavePage me={me} leaves={leaves} leaveTypes={leaveTypes} onApply={applyLeave} onWithdraw={withdrawLeave} onAddAttachment={addLeaveAttachment} />
          )}
          {page === "dayoff" && (
            <DayOffPage me={me} users={employees} dayOffs={dayOffs} onToggle={toggleDayOff} monthLocks={monthLocks} onToggleLock={toggleMonthLock} />
          )}
          {page === "admin" && me.role === "admin" && (
            <AdminPanel me={me} users={employees} departments={departments} records={records} outings={outings}
              leaves={leaves} leaveTypes={leaveTypes} requests={requests} audit={audit} actions={adminActions} />
          )}
        </main>
      </div>

      <nav className="bottomnav lg:hidden">
        {navs.map(([k, l]) => (
          <button key={k} className={page === k ? "on" : ""} onClick={() => setPage(k)}>{l}</button>
        ))}
      </nav>

      {toast && (
        <div className="fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full text-sm text-white z-50" style={{ background: "#1A0800" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PhaseAttendance />);
</script>
<script>
  // 手動轉譯，強制用傳統 JSX runtime（React.createElement），
  // 避免 @babel/standalone 自動轉譯時插入 `import` 陳述式導致 classic script 執行失敗
  const __src = document.getElementById("app-source").textContent;
  const __out = Babel.transform(__src, {
    presets: [["react", { runtime: "classic" }]],
    filename: "app.jsx",
  }).code;
  const __s = document.createElement("script");
  __s.textContent = __out;
  document.body.appendChild(__s);
</script>
</body>
</html>
