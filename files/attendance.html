<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const { createClient } = supabase;
const sb = createClient(window.__SUPABASE_URL__, window.__SUPABASE_ANON_KEY__);
// 6 位數字，方便口頭告訴員工、登入後再請他們自行改成好記的密碼
const genTempPassword = () => String(Math.floor(100000 + Math.random() * 900000));
// 透過 Edge Function（create-employee-auth）用 Admin API 建立登入帳號，
// 不會受 signUp() 的 email 流量限制影響，也不需要在前端放 service_role key
async function signUpEmployee(email, password) {
  const { data, error } = await sb.functions.invoke("create-employee-auth", { body: { email, password } });
  console.log("[signUpEmployee] data=", data, "error=", error);
  if (error) {
    let msg = error.message || String(error);
    try {
      const body = await error.context?.json?.();
      console.log("[signUpEmployee] error.context body=", body);
      if (body?.error) msg = body.error;
    } catch (e2) { console.log("[signUpEmployee] context parse failed", e2); }
    return { userId: null, error: msg };
  }
  if (!data?.userId) return { userId: null, error: data?.error || `未取得使用者 ID（原始回應：${JSON.stringify(data)}）` };
  return { userId: data.userId, error: null };
}

/* ---------- 工具 ---------- */
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const nowStamp = () => { const d = new Date(); return `${fmtDate(d)} ${fmtTime(d)}`; };
const fmtStamp = (iso) => { if (!iso) return ""; const d = new Date(iso); return `${fmtDate(d)} ${fmtTime(d)}`; };
const hm = (t) => (t ? String(t).slice(0, 5) : t);
const today = () => fmtDate(new Date());
const weekdayNames = ["日", "一", "二", "三", "四", "五", "六"];
const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const sessionHours = (sessions) =>
  (sessions.filter((s) => s.in && s.out).reduce((a, s) => a + (mins(s.out) - mins(s.in)), 0) / 60).toFixed(1);
const dtOf = (d, t) => new Date(`${d}T${t || "00:00"}:00`);
const leaveCovers = (lv, ds) => lv.startDate <= ds && ds <= lv.endDate;
const leaveOverlap = (a, b) =>
  dtOf(a.startDate, a.startTime) < dtOf(b.endDate, b.endTime) &&
  dtOf(b.startDate, b.startTime) < dtOf(a.endDate, a.endTime);
const firstIn = (rec) => rec?.sessions?.[0]?.in ?? null;
const lastOut = (rec) => {
  if (!rec || rec.sessions.length === 0) return null;
  if (rec.sessions.some((s) => !s.out)) return null;
  return rec.sessions[rec.sessions.length - 1].out;
};
const getPosition = () => new Promise((resolve) => {
  if (!navigator.geolocation) { resolve(null); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => resolve({
      lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5),
      accuracy: Math.round(pos.coords.accuracy),
    }),
    () => resolve(null),
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

/* ---------- Supabase row → 前端物件 對照 ---------- */
const mapDept = (r) => ({ id: r.id, name: r.name, code: r.code, note: r.note ?? "", status: r.status });
const mapLeaveType = (r) => ({ id: r.id, name: r.name, code: r.code, description: r.description ?? "", status: r.status });
const mapEmployee = (r) => ({
  id: r.id, authUserId: r.auth_user_id, email: r.email ?? "", employeeCode: r.employee_code ?? "", name: r.name,
  departmentId: r.department_id, department: r.departments?.name ?? "—",
  role: r.role, active: r.active, failedLogins: r.failed_logins,
});
const mapRecord = (r) => ({
  id: r.id, userId: r.employee_id, date: r.date, sessions: r.sessions || [],
  lat: r.lat, lng: r.lng, accuracy: r.accuracy, address: r.address, ip: r.ip,
  modified: r.modified, history: r.history || [],
});
const OUTING_CATS = {
  general: { label: "外出", tagKey: "seg" },
  store_support: { label: "巡店支援", tagKey: "in" },
  meeting: { label: "開會", tagKey: "out" },
  other: { label: "其他", tagKey: "seg" },
};
// 巡店支援只能選實體門市／烘豆場，不含總部這類非門市單位
const STORE_LOCATIONS = ["中山店", "勤美店", "水湳店", "烘豆場"];
const mapOuting = (r) => ({
  id: r.id, userId: r.employee_id, date: r.date,
  start: hm(r.start_time), expectedEnd: hm(r.expected_end), end: hm(r.end_time),
  destination: r.destination, purpose: r.purpose, category: r.category || "general",
  departLat: r.depart_lat, departLng: r.depart_lng, departAccuracy: r.depart_accuracy,
  arriveLat: r.arrive_lat, arriveLng: r.arrive_lng, arriveAccuracy: r.arrive_accuracy, arrivedAt: r.arrived_at,
  returnLat: r.return_lat, returnLng: r.return_lng, returnAccuracy: r.return_accuracy, returnAddress: r.return_address,
  returnedAt: r.returned_at,
});
const mapLeave = (r) => ({
  id: r.id, userId: r.employee_id, typeId: r.leave_type_id, reason: r.reason,
  startDate: r.start_date, startTime: hm(r.start_time), endDate: r.end_date, endTime: hm(r.end_time),
  hours: r.hours, note: r.note ?? "", attachments: r.attachments || [],
  status: r.status, appliedAt: fmtStamp(r.applied_at),
  approvedBy: r.approver ? { name: r.approver.name, email: r.approver.email } : null,
  approvedAt: fmtStamp(r.approved_at), approvalNote: r.approval_note,
  rejectedBy: r.rejecter ? { name: r.rejecter.name, email: r.rejecter.email } : null,
  rejectedAt: fmtStamp(r.rejected_at), rejectionReason: r.rejection_reason,
  withdrawnAt: fmtStamp(r.withdrawn_at),
});
const mapRequest = (r) => ({
  id: r.id, userId: r.employee_id, recordDate: r.record_date, sessionIdx: r.session_idx,
  field: r.field, value: r.value, reason: r.reason, status: r.status,
});
const mapAudit = (r) => ({ time: fmtStamp(r.created_at), actor: r.actor_label, action: r.action, target: r.target, detail: r.detail ?? "" });
const mapDayOff = (r) => ({ id: r.id, userId: r.employee_id, date: r.date });
const mapSnapshot = (r) => ({
  date: r.snapshot_date, user_id: r.employee_id, employee_name: r.employee_name, department: r.department,
  sessions: r.sessions || [], session_count: r.session_count,
  first_clock_in: r.first_clock_in, last_clock_out: r.last_clock_out,
  outings: r.outings || [], leaves: r.leaves || [], has_been_modified: r.modified,
});

/* ---------- 狀態推導（與原設計一致） ----------
   優先順序：進行中的班次 > 請假 > 已下班 > 尚未上班 */
function deriveStatus(rec, dayOutings, dayLeaves, dateStr) {
  const isPast = dateStr < today();
  const isToday = dateStr === today();
  const approved = (dayLeaves || []).filter((l) => l.status === "approved");
  const open = rec?.sessions?.find((s) => s.in && !s.out);
  if (open) {
    if (isPast) return { key: "abn", label: "出勤異常" };
    const activeOut = (dayOutings || []).find((o) => o.start && !o.end);
    if (activeOut) return { key: "out", label: "外出中" };
    return { key: "in", label: "已上班" };
  }
  if (isToday && approved.some((l) => {
    const now = new Date();
    return dtOf(l.startDate, l.startTime) <= now && now <= dtOf(l.endDate, l.endTime);
  })) return { key: "leave", label: "請假" };
  if (rec && rec.sessions.length > 0) return { key: "done", label: "已下班" };
  if (approved.length > 0) return { key: "leave", label: "請假" };
  return { key: "off", label: "尚未上班" };
}
const buildViewRow = (r) => {
  const s = mapSnapshot(r);
  return { ...s, attendance_status: deriveStatus({ sessions: s.sessions }, s.outings, s.leaves, s.date) };
};

/* ---------- 附件（Supabase Storage，bucket 為 private，需簽章網址才能存取） ---------- */
async function uploadAttachments(files, authUserId, leaveId) {
  const out = [];
  for (const file of files) {
    const path = `${authUserId}/${leaveId}/${Date.now()}-${file.name}`;
    const { error } = await sb.storage.from("leave-attachments").upload(path, file);
    if (error) { console.error("upload failed", error); continue; }
    out.push({ name: file.name, size: file.size, type: file.type, storage_path: path, uploaded_at: nowStamp() });
  }
  return out;
}
function AttachmentThumb({ att }) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    let alive = true;
    sb.storage.from("leave-attachments").createSignedUrl(att.storage_path, 3600).then(({ data }) => {
      if (alive && data) setUrl(data.signedUrl);
    });
    return () => { alive = false; };
  }, [att.storage_path]);
  if (!url) return <span className="tag t-seg">{att.name}（載入中…）</span>;
  return att.type?.startsWith("image/")
    ? <a href={url} download={att.name} title={att.name}>
        <img src={url} alt={att.name} style={{ height: 56, borderRadius: 6, border: "1px solid #E4E0DA" }} />
      </a>
    : <a href={url} download={att.name} className="tag t-seg">{att.name}</a>;
}

/* ---------- 小元件 ---------- */
const Tag = ({ k, children }) => <span className={`tag t-${k}`}>{children}</span>;

const LV_STATUS = {

/* ---------- 登入（Supabase Auth，帳號為 email） ---------- */
function Login() {
  const [code, setCode] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const resolveEmail = async (c) => {
    const { data, error } = await sb.rpc("code_to_email", { p_code: c });
    if (error || !data) return null;
    return data;
  };
  const submit = async () => {
    if (!code.trim() || !pw) return;
    setErr(""); setBusy(true);
    const email = await resolveEmail(code.trim());
    if (!email) {
      sb.rpc("record_failed_login", { p_email: `code:${code.trim()}` });
      setBusy(false); setErr("帳號或密碼不正確"); return;
    }
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    setBusy(false);
    if (error) {
      sb.rpc("record_failed_login", { p_email: email });
      setErr("帳號或密碼不正確");
    }
  };
  const forgot = () => {
    setErr("忘記密碼請洽管理員，由管理後台「員工管理」按「重設密碼」處理。");
  };
  return (
    <div className="ph-root flex items-center justify-center min-h-screen p-6">
      <div className="w-full max-w-sm">
        <div className="text-center mb-10">
          <div className="f-serif text-3xl font-bold tracking-widest">PHASE</div>
          <div className="text-xs tracking-widest mt-1" style={{ color: "#8B857C", letterSpacing: ".3em" }}>ATTENDANCE</div>
          <div className="f-serif mt-6 text-lg">出勤管理系統</div>
        </div>
        <div className="card p-6 space-y-4">
          <div>
            <label className="text-xs" style={{ color: "#8B857C" }}>員工代碼</label>
            <input className="inp mt-1" value={code} onChange={(e) => setCode(e.target.value)} placeholder="例：bozhe" />
          </div>
          <div>
            <label className="text-xs" style={{ color: "#8B857C" }}>密碼</label>
            <input className="inp mt-1" type="password" value={pw} onChange={(e) => setPw(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="••••••" />
          </div>
          {err && <div className="text-sm brick">{err}</div>}
          <button className="btn btn-ink w-full" disabled={busy} onClick={submit}>{busy ? "登入中…" : "登入"}</button>
          <button className="text-xs underline" style={{ color: "#8B857C" }} onClick={forgot}>忘記密碼</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- 個人打卡卡片 ---------- */
function ClockCard({ me, myRec, myOutings, myLeavesToday, now, departments, onClockIn, onClockOut, onOutStart, onOutEnd, onAddDestination, onOutArrive }) {
  const st = deriveStatus(myRec, myOutings, myLeavesToday, today());
  const open = myRec?.sessions?.find((s) => !s.out);
  const activeOut = myOutings.find((o) => !o.end);
  const [showOut, setShowOut] = useState(false);
  const [destList, setDestList] = useState([""]);
  const [purpose, setPurpose] = useState("");
  const [expEnd, setExpEnd] = useState("");
  const [cat, setCat] = useState("general");
  const purposeOptional = cat === "store_support" || cat === "meeting";
  const [addDestOpen, setAddDestOpen] = useState(false);
  const [newDest, setNewDest] = useState("");
  const segCount = myRec?.sessions?.length ?? 0;
  return (
    <div className="card p-6">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <div className="text-xs" style={{ color: "#8B857C" }}>{today()}（{weekdayNames[now.getDay()]}）· {me.department}</div>
          <div className="f-serif font-semibold clockdigits" style={{ fontSize: 44, lineHeight: 1.2 }}>
            {pad(now.getHours())}:{pad(now.getMinutes())}<span className="text-xl" style={{ color: "#B3ADA4" }}>:{pad(now.getSeconds())}</span>
          </div>
        </div>
        <div className="text-right space-y-1">
          <StatusTag st={st} />
          {segCount > 1 && <div><span className="tag t-seg">今日第 {segCount} 段</span></div>}
        </div>
      </div>
      <div className="flex flex-wrap gap-3 mt-5">
        <button className="btn btn-ink" disabled={!!open} onClick={onClockIn}>
          {segCount > 0 && !open ? "再次上班打卡" : "上班打卡"}
        </button>
        <button className="btn btn-line" disabled={!open || !!activeOut} onClick={() => setShowOut(true)}>外出登記</button>
        {activeOut && <button className="btn btn-line" onClick={() => { setNewDest(""); setAddDestOpen(true); }}>臨時加地點</button>}
        {activeOut && !activeOut.arrivedAt && <button className="btn btn-line" onClick={onOutArrive}>到達</button>}
        {activeOut && <button className="btn btn-brick" onClick={onOutEnd}>返回</button>}
        <button className="btn btn-line" disabled={!open || !!activeOut} onClick={onClockOut}>下班打卡</button>
      </div>
      <div className="mt-4 dline">
        {myRec?.sessions?.map((s, i) => (
          <div key={i} className={i > 0 ? "mt-1" : ""}><b>第 {i + 1} 段</b>　上班 {s.in}{s.out ? `　下班 ${s.out}` : "　（進行中）"}</div>
        ))}
        {myOutings.map((o, i) => (
          <div key={i} className={i > 0 ? "mt-1" : ""}>
            <Tag k={OUTING_CATS[o.category]?.tagKey ?? "seg"}>{OUTING_CATS[o.category]?.label ?? "外出"}</Tag>
            　{o.start} 出發
            {o.expectedEnd && `　預計 ${o.expectedEnd} 返回`}
            {!o.end && (o.arrivedAt ? `　已到達（${fmtTime(new Date(o.arrivedAt))}）` : "　（外出中，尚未到達）")}
            {o.end ? `　實際 ${o.end} 返回` : ""}
            　{o.destination} · {o.purpose}
          </div>
        ))}
        {segCount === 0 && !myLeavesToday.length && "今日尚未打卡。下班後如需再次上班，可重新打卡，各段紀錄皆完整保留。"}
        {segCount === 0 && myLeavesToday.some((l) => l.status === "approved") && "今日為請假日。"}
      </div>
      {showOut && (
        <Modal title="外出登記" onClose={() => setShowOut(false)}>
          <div className="space-y-3">
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>外出類型</label>
              <div className="flex flex-wrap gap-2 mt-1">
                {Object.entries(OUTING_CATS).map(([k, v]) => (
                  <button key={k} type="button" className={`chip ${cat === k ? "on" : ""}`} onClick={() => { setCat(k); setDestList([""]); }}>{v.label}</button>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>外出地點（一趟外出要跑多個地方可以逐一新增）</label>
              <div className="space-y-2 mt-1">
                {destList.map((v, i) => (
                  <div key={i} className="flex gap-2">
                    {cat === "store_support" ? (
                      <select className="inp" value={v}
                        onChange={(e) => setDestList((arr) => arr.map((x, j) => (j === i ? e.target.value : x)))}>
                        <option value="">請選擇門市</option>
                        {departments.filter((d) => d.status === "active" && STORE_LOCATIONS.includes(d.name)).map((d) => <option key={d.id} value={d.name}>{d.name}</option>)}
                      </select>
                    ) : (
                      <input className="inp" value={v} placeholder={`地點 ${i + 1}，例：展晟印刷、烘豆場`}
                        onChange={(e) => setDestList((arr) => arr.map((x, j) => (j === i ? e.target.value : x)))} />
                    )}
                    {destList.length > 1 && (
                      <button type="button" className="btn btn-line" onClick={() => setDestList((arr) => arr.filter((_, j) => j !== i))}>移除</button>
                    )}
                  </div>
                ))}
                <button type="button" className="text-xs underline" style={{ color: "#8B857C" }}
                  onClick={() => setDestList((arr) => [...arr, ""])}>+ 新增地點</button>
              </div>
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>外出事由{purposeOptional ? "（選填）" : " *"}</label>
              <input className="inp mt-1" value={purpose} onChange={(e) => setPurpose(e.target.value)} placeholder="例：取豆卡、送批發豆" />
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>預計返回時間（選填）</label>
              <input className="inp mt-1" type="time" value={expEnd} onChange={(e) => setExpEnd(e.target.value)} />
            </div>
            <div className="text-xs" style={{ color: "#8B857C" }}>外出地點與事由為公開資訊，全體同仁皆可查看。</div>
            <button className="btn btn-ink w-full" disabled={!destList.some((v) => v.trim()) || (!purposeOptional && !purpose.trim())}
              onClick={() => {
                const dest = destList.map((v) => v.trim()).filter(Boolean).join(" → ");
                onOutStart(dest, purpose, expEnd || null, cat);
                setShowOut(false); setDestList([""]); setPurpose(""); setExpEnd(""); setCat("general");
              }}>
              開始外出
            </button>
          </div>
        </Modal>
      )}
      {addDestOpen && activeOut && (
        <Modal title="臨時加地點" onClose={() => setAddDestOpen(false)}>
          <div className="space-y-3">
            <div className="text-xs" style={{ color: "#8B857C" }}>目前地點：{activeOut.destination}</div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>要加去的地點</label>
              <input className="inp mt-1" value={newDest} onChange={(e) => setNewDest(e.target.value)} placeholder="例：郵局" />
            </div>
            <button className="btn btn-ink w-full" disabled={!newDest.trim()}
              onClick={() => { onAddDestination(activeOut, newDest.trim()); setAddDestOpen(false); }}>
              加入地點
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- 全員出勤狀態 ---------- */
function TeamBoard({ view, lastSync, syncStatus, dayOffs }) {
  const [filter, setFilter] = useState("all");
  const [dept, setDept] = useState("all");
  const depts = [...new Set(view.map((r) => r.department))];
  const ds = today();
  const isDayOff = (userId) => dayOffs.some((o) => o.userId === userId && o.date === ds);
  const chips = [
    ["all", "全部"], ["in", "已上班"], ["off", "尚未上班"], ["out", "外出中"],
    ["done", "已下班"], ["leave", "請假"], ["abn", "異常"],
  ];
  const rows = view.filter((r) => {
    if (dept !== "all" && r.department !== dept) return false;
    if (filter === "all") return true;
    return r.attendance_status.key === filter;
  });
  const counts = useMemo(() => {
    const c = { in: 0, off: 0, out: 0, done: 0, abn: 0, leave: 0 };
    view.forEach((r) => { c[r.attendance_status.key] = (c[r.attendance_status.key] ?? 0) + 1; });
    return c;
  }, [view]);
  return (
    <div className="card p-6">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <h2 className="f-serif text-lg font-semibold">全員出勤狀態</h2>
          <div className="text-xs mt-1" style={{ color: "#B3ADA4" }}>
            {syncStatus === "SUBSCRIBED" ? "● 即時同步中" : "○ 連線中，資料可能非最新"} · 最後更新 {lastSync}
          </div>
        </div>
        <div className="text-xs" style={{ color: "#8B857C" }}>
          在班 {counts.in}　外出 {counts.out}　未上班 {counts.off}　已下班 {counts.done}　請假 {counts.leave}　異常 {counts.abn}
        </div>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        {chips.map(([k, label]) => (
          <button key={k} className={`chip ${filter === k ? "on" : ""}`} onClick={() => setFilter(k)}>{label}</button>
        ))}
        <select className="inp" style={{ width: "auto", padding: "5px 10px", fontSize: 13 }} value={dept} onChange={(e) => setDept(e.target.value)}>
          <option value="all">所有單位</option>
          {depts.map((d) => <option key={d}>{d}</option>)}
        </select>
      </div>
      <div className="hidden md:block overflow-x-auto">
        <table className="w-full">
          <thead><tr>
            <th className="th">員工</th><th className="th">單位</th><th className="th">狀態</th>
            <th className="th">上班</th><th className="th">下班</th>
            <th className="th">外出／請假</th><th className="th">備註</th>
          </tr></thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.user_id}>
                <td className="td font-medium">{r.employee_name}</td>
                <td className="td" style={{ color: "#8B857C" }}>{r.department}</td>
                <td className="td">
                  <StatusTag st={r.attendance_status} />
                  {isDayOff(r.user_id) && <span className="tag t-leave ml-1">已排休</span>}
                </td>
                <td className="td">
                  {r.first_clock_in ?? "—"}
                  {r.session_count > 1 && <span className="tag t-seg ml-1">{r.session_count} 段</span>}
                </td>
                <td className="td">{r.last_clock_out ?? "—"}</td>
                <td className="td">
                  {r.outings.length === 0 && r.leaves.length === 0 && "—"}
                  {r.outings.map((o, i) => (
                    <div key={`o${i}`} className="mt-1"><Tag k={OUTING_CATS[o.category]?.tagKey ?? "seg"}>{OUTING_CATS[o.category]?.label ?? "外出"}</Tag> {o.start}{o.end ? `–${o.end}` : " 起"} · {o.destination} · {o.purpose}</div>
                  ))}
                  {r.leaves.map((l, i) => (
                    <div key={`l${i}`} className="mt-1">
                      {l.type} {l.startTime}–{l.endTime}
                      {l.startDate !== l.endDate && `（${l.startDate}～${l.endDate}）`}
                    </div>
                  ))}
                </td>
                <td className="td">{r.has_been_modified && <span className="tag t-mod">已異動</span>}</td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td className="td" colSpan={7} style={{ color: "#B3ADA4" }}>沒有符合條件的員工</td></tr>}
          </tbody>
        </table>
      </div>

      <div className="md:hidden space-y-2">
        {rows.map((r) => (
          <div key={r.user_id} className="border hair rounded-lg p-3">
            <div className="flex items-center justify-between gap-2">
              <div>
                <span className="font-medium text-sm">{r.employee_name}</span>
                <span className="text-xs ml-2" style={{ color: "#8B857C" }}>{r.department}</span>
              </div>
              <div className="text-right space-y-1">
                <StatusTag st={r.attendance_status} />
                {isDayOff(r.user_id) && <div><span className="tag t-leave">已排休</span></div>}
              </div>
            </div>
            <div className="dline mt-1">
              {(r.first_clock_in || r.last_clock_out) && (
                <div>
                  {r.first_clock_in ?? "—"}–{r.last_clock_out ?? "…"}
                  {r.session_count > 1 && <span className="tag t-seg ml-1">{r.session_count} 段</span>}
                  {r.has_been_modified && <span className="tag t-mod ml-1">已異動</span>}
                </div>
              )}
              {r.outings.map((o, i) => (
                <div key={`o${i}`} className="mt-2"><Tag k={OUTING_CATS[o.category]?.tagKey ?? "seg"}>{OUTING_CATS[o.category]?.label ?? "外出"}</Tag> {o.start}{o.end ? `–${o.end}` : " 起"} · {o.destination} · {o.purpose}</div>
              ))}
              {r.leaves.map((l, i) => (
                <div key={`l${i}`} className="mt-2">
                  {l.type} {l.startTime}–{l.endTime}
                  {l.startDate !== l.endDate && `（${l.startDate}～${l.endDate}）`}
                </div>
              ))}
            </div>
          </div>
        ))}
        {rows.length === 0 && <div className="text-sm" style={{ color: "#B3ADA4" }}>沒有符合條件的員工</div>}
      </div>
    </div>
  );
}

/* ---------- 行事曆（跨同仁資料一律走 team_snapshot RPC，事由僅本人／管理員可見時才從本地 leaves 補上） ---------- */
function CalendarView({ me, users, leaves, leaveTypes, dayOffs }) {
  const nowD = new Date();
  const [ym, setYm] = useState({ y: nowD.getFullYear(), m: nowD.getMonth() });
  const [mode, setMode] = useState("person");
  const staff = users.filter((u) => u.active && u.role !== "admin");
  const [pick, setPick] = useState(staff[0]?.id);
  const [openDay, setOpenDay] = useState(null);
  const [monthRows, setMonthRows] = useState([]);

  const first = new Date(ym.y, ym.m, 1);
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const lead = first.getDay();
  const cells = [...Array(lead).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];
  const dstr = (d) => `${ym.y}-${pad(ym.m + 1)}-${pad(d)}`;
  const move = (k) => setYm(({ y, m }) => { const d = new Date(y, m + k, 1); return { y: d.getFullYear(), m: d.getMonth() }; });

  useEffect(() => {
    const start = dstr(1), end = dstr(daysInMonth);
    const empFilter = mode === "person" ? pick : null;
    sb.rpc("team_snapshot", { p_start: start, p_end: end, p_employee_id: empFilter || null }).then(({ data, error }) => {
      if (!error) setMonthRows((data || []).map(buildViewRow));
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ym.y, ym.m, mode, pick]);

  const rowsFor = (uid, ds) => monthRows.filter((r) => r.user_id === uid && r.date === ds);
  const tName = (id) => leaveTypes.find((t) => t.id === id)?.name ?? "—";
  const canSeeReason = (uid) => me.role === "admin" || me.id === uid;
  const reasonFor = (leaveSnapId) => leaves.find((l) => l.id === leaveSnapId)?.reason ?? null;
  const isDayOff = (uid, ds) => dayOffs.some((o) => o.userId === uid && o.date === ds);

  return (
    <div className="card p-6 cal-card">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <h2 className="f-serif text-lg font-semibold">出勤行事曆</h2>
        <div className="flex gap-2">
          <button className={`chip ${mode === "person" ? "on" : ""}`} onClick={() => setMode("person")}>個別員工</button>
          <button className={`chip ${mode === "all" ? "on" : ""}`} onClick={() => setMode("all")}>全員總覽</button>
        </div>
      </div>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <button className="btn btn-line" onClick={() => move(-1)}>‹</button>
        <div className="f-serif font-semibold">{ym.y} 年 {ym.m + 1} 月</div>
        <button className="btn btn-line" onClick={() => move(1)}>›</button>
        {mode === "person" && (
          <select className="inp" style={{ width: "auto", padding: "6px 10px", fontSize: 13 }} value={pick} onChange={(e) => setPick(e.target.value)}>
            {staff.map((u) => <option key={u.id} value={u.id}>{u.name}（{u.department}）</option>)}
          </select>
        )}
      </div>
      <div className="grid grid-cols-7 gap-1 text-center text-xs mb-1" style={{ color: "#8B857C" }}>
        {weekdayNames.map((w) => <div key={w} className="py-1">{w}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1 cal-grid">
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const ds = dstr(d);
          const isFutureNoLeave = ds > today();
          if (mode === "person") {
            const row = rowsFor(pick, ds)[0];
            const ls = row?.leaves ?? [];
            const st = row?.attendance_status ?? { key: "off", label: "尚未上班" };
            const showable = !isFutureNoLeave || ls.length > 0;
            return (
              <button key={i} onClick={() => showable && setOpenDay(ds)}
                className="text-left rounded-lg p-2 border hair bg-white hover:opacity-80 daycell" style={{ minHeight: 70, opacity: showable ? 1 : 0.4 }}>
                <div className="text-xs font-medium">{d}</div>
                {showable && (
                  <div className="mt-1 space-y-1">
                    {isFutureNoLeave
                      ? ls.map((l, j) => <Tag key={j} k="leave">{l.type}</Tag>)
                      : <StatusTag st={st} />}
                    {isDayOff(pick, ds) && <div><Tag k="leave">已排休</Tag></div>}
                    {row?.first_clock_in && (
                      <div className="text-xs" style={{ color: "#8B857C" }}>
                        {row.first_clock_in}–{row.last_clock_out ?? "…"}{row.session_count > 1 ? ` · ${row.session_count}段` : ""}
                      </div>
                    )}
                  </div>
                )}
              </button>
            );
          }
          const stats = { in: 0, off: 0, out: 0, done: 0, abn: 0, leave: 0, dayOff: 0 };
          const leaveNames = [], dayOffNames = [], outNames = [], abnNames = [];
          staff.forEach((u) => {
            const row = rowsFor(u.id, ds)[0];
            const st = row?.attendance_status ?? { key: "off" };
            stats[st.key] = (stats[st.key] ?? 0) + 1;
            if (row?.leaves?.length > 0) leaveNames.push(u.name);
            if (isDayOff(u.id, ds)) { stats.dayOff += 1; dayOffNames.push(u.name); }
            if (row?.outings?.some((o) => !o.end)) outNames.push(u.name);
            if (st.key === "abn") abnNames.push(u.name);
          });
          const namesLine = (names) => names.slice(0, 3).join("、") + (names.length > 3 ? ` +${names.length - 3}` : "");
          const showable = !isFutureNoLeave || leaveNames.length > 0 || dayOffNames.length > 0;
          const hasDayOff = dayOffNames.length > 0;
          return (
            <button key={i} onClick={() => showable && setOpenDay(ds)}
              className="text-left rounded-lg p-2 border hair bg-white hover:opacity-80 daycell" style={{ minHeight: 70, opacity: showable ? 1 : 0.4 }}>
              <div className="text-xs font-medium">{d}</div>
              {showable && (
                <div className="mt-1 text-xs leading-5" style={{ color: "#5A554E" }}>
                  {!isFutureNoLeave && <>班 {stats.in + stats.done}</>}
                  {outNames.length > 0 && (
                    <div style={{ color: "#9C6404", background: "rgba(212,135,10,.16)", borderRadius: 4, padding: "0 3px", display: "inline-block" }}>
                      {namesLine(outNames)}
                    </div>
                  )}
                  {leaveNames.length > 0 && <div style={{ color: "#A85C5C" }}>假：{namesLine(leaveNames)}</div>}
                  {hasDayOff && (
                    <div style={{ color: "#A85C5C", background: "rgba(196,120,120,.16)", borderRadius: 4, padding: "0 3px", display: "inline-block" }}>
                      {namesLine(dayOffNames)}
                    </div>
                  )}
                  {abnNames.length > 0 && <div className="brick">異常：{namesLine(abnNames)}</div>}
                </div>
              )}
            </button>
          );
        })}
      </div>

      {openDay && (
        <Modal title={`${openDay} 出勤明細`} wide onClose={() => setOpenDay(null)}>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead><tr>
                <th className="th">員工</th><th className="th">狀態</th><th className="th">上下班明細</th>
                <th className="th">時數</th><th className="th">外出明細</th><th className="th">請假</th><th className="th">備註</th>
              </tr></thead>
              <tbody>
                {(mode === "person" ? staff.filter((u) => u.id === pick) : staff).map((u) => {
                  const row = rowsFor(u.id, openDay)[0];
                  const st = row?.attendance_status ?? { key: "off", label: "尚未上班" };
                  const sessions = row?.sessions ?? [];
                  const os = row?.outings ?? [];
                  const ls = row?.leaves ?? [];
                  return (
                    <tr key={u.id}>
                      <td className="td font-medium">{u.name}</td>
                      <td className="td">
                        <StatusTag st={st} />
                        {isDayOff(u.id, openDay) && <span className="tag t-leave ml-1">已排休</span>}
                      </td>
                      <td className="td">
                        {sessions.length === 0 && "—"}
                        {sessions.map((s, i) => <div key={i} className={i > 0 ? "mt-1" : ""}>第{i + 1}段　{s.in}–{s.out ?? "…"}</div>)}
                      </td>
                      <td className="td">{sessions.length ? sessionHours(sessions) : "—"}</td>
                      <td className="td">
                        {os.length === 0 && "—"}
                        {os.map((o, i) => <div key={i} className={i > 0 ? "mt-1" : ""}><Tag k={OUTING_CATS[o.category]?.tagKey ?? "seg"}>{OUTING_CATS[o.category]?.label ?? "外出"}</Tag> {o.start}–{o.end ?? "…"} · {o.destination} · {o.purpose}</div>)}
                      </td>
                      <td className="td">
                        {ls.length === 0 && "—"}
                        {ls.map((l, i) => (
                          <div key={i} className={i > 0 ? "mt-1" : ""}>
                            {l.type} {l.startDate === l.endDate ? "" : `${l.startDate}～${l.endDate} `}{l.startTime}–{l.endTime}
                            <div className="text-xs" style={{ color: "#8B857C" }}>
                              已批准 · 核准：{l.approvedByName ?? "—"}
                              {canSeeReason(u.id) && reasonFor(l.id) && ` · 事由：${reasonFor(l.id)}`}
                            </div>
                          </div>
                        ))}
                      </td>
                      <td className="td">{row?.has_been_modified && <span className="tag t-mod">已異動</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="text-xs mt-3" style={{ color: "#B3ADA4" }}>請假事由僅限本人與管理員查看，其他同仁僅顯示假別與時段。</div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- 排休（月休表，自助、不需審核，同一天可多人排休） ---------- */
function DayOffPage({ me, users, dayOffs, onToggle, monthLocks, onToggleLock }) {
  const nowD = new Date();
  const [ym, setYm] = useState({ y: nowD.getFullYear(), m: nowD.getMonth() });
  const staff = users.filter((u) => u.active && u.role !== "admin");
  const canEditOthers = me.role === "admin";
  const [pick, setPick] = useState(canEditOthers ? staff[0]?.id : me.id);
  const targetId = canEditOthers ? pick : me.id;
  const targetDept = users.find((u) => u.id === targetId)?.department;
  const yearMonth = `${ym.y}-${pad(ym.m + 1)}`;
  const isLocked = monthLocks.includes(yearMonth);

  const first = new Date(ym.y, ym.m, 1);
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const lead = first.getDay();
  const cells = [...Array(lead).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];
  const dstr = (d) => `${ym.y}-${pad(ym.m + 1)}-${pad(d)}`;
  const move = (k) => setYm(({ y, m }) => { const d = new Date(y, m + k, 1); return { y: d.getFullYear(), m: d.getMonth() }; });

  const offsOn = (ds) => dayOffs.filter((o) => o.date === ds);
  const isTargetOff = (ds) => offsOn(ds).some((o) => o.userId === targetId);
  const sameDeptNames = (ds) => offsOn(ds)
    .map((o) => users.find((u) => u.id === o.userId))
    .filter((u) => u && u.department === targetDept)
    .map((u) => u.name);

  return (
    <div className="card p-6 cal-card">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <h2 className="f-serif text-lg font-semibold">排休</h2>
        {canEditOthers && (
          <select className="inp" style={{ width: "auto", padding: "6px 10px", fontSize: 13 }} value={pick} onChange={(e) => setPick(e.target.value)}>
            {staff.map((u) => <option key={u.id} value={u.id}>{u.name}（{u.department}）</option>)}
          </select>
        )}
      </div>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <button className="btn btn-line" onClick={() => move(-1)}>‹</button>
        <div className="f-serif font-semibold">{ym.y} 年 {ym.m + 1} 月</div>
        <button className="btn btn-line" onClick={() => move(1)}>›</button>
        {isLocked
          ? <Tag k="abn">本月已鎖定</Tag>
          : <Tag k="in">本月開放排休</Tag>}
        {canEditOthers && (
          <button className={`btn ${isLocked ? "btn-line" : "btn-brick"}`} onClick={() => onToggleLock(yearMonth, isLocked)}>
            {isLocked ? "解鎖本月" : "鎖定本月"}
          </button>
        )}
      </div>
      {isLocked && !canEditOthers && (
        <div className="text-xs mb-3" style={{ color: "#A85C5C" }}>本月排休已由管理員鎖定，如需異動請洽管理員。</div>
      )}
      <div className="grid grid-cols-7 gap-1 text-center text-xs mb-1" style={{ color: "#8B857C" }}>
        {weekdayNames.map((w) => <div key={w} className="py-1">{w}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1 cal-grid">
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const ds = dstr(d);
          const isPast = ds < today();
          const locked = isLocked && !canEditOthers;
          const mine = isTargetOff(ds);
          const names = sameDeptNames(ds);
          return (
            <button key={i} disabled={isPast || locked} onClick={() => onToggle(targetId, ds, mine)}
              className="text-left rounded-lg p-2 border hover:opacity-80 daycell"
              style={{
                minHeight: 74, opacity: (isPast || locked) ? 0.4 : 1,
                background: mine ? "#F6E9E9" : "#fff", borderColor: mine ? "#C47878" : "#E4E0DA",
              }}>
              <div className="text-xs font-medium">{d}</div>
              {mine && <div className="mt-1"><Tag k="leave">已排休</Tag></div>}
              {names.length > 0 && (
                <div className="text-xs mt-1" style={{ color: "#8B857C" }}>
                  {names.slice(0, 3).join("、")}{names.length > 3 ? ` +${names.length - 3}` : ""}
                </div>
              )}
            </button>
          );
        })}
      </div>
      <div className="text-xs mt-4" style={{ color: "#B3ADA4" }}>
        點日期即可排休／取消排休，不需要審核，排定後立即生效，同一天可以有多人排休、沒有人數限制。日期格子裡顯示的是同單位同仁的排休狀況，方便互相協調班表。管理員可以「鎖定本月」讓班表定案，鎖定後同仁不能自行更改，需要調整請洽管理員。
      </div>
    </div>
  );
}

/* ---------- 請假申請（員工） ---------- */
function LeavePage({ me, leaves, leaveTypes, onApply, onWithdraw, onAddAttachment }) {
  const mine = leaves.filter((l) => l.userId === me.id).sort((a, b) => b.appliedAt.localeCompare(a.appliedAt));
  const activeTypes = leaveTypes.filter((t) => t.status === "active");
  const [open, setOpen] = useState(false);
  const empty = { typeId: activeTypes[0]?.id ?? "", reason: "", startDate: today(), startTime: "09:00", endDate: today(), endTime: "18:00", hours: "8", note: "", attachments: [] };
  const [f, setF] = useState(empty);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const tName = (id) => leaveTypes.find((t) => t.id === id)?.name ?? "—";

  const recalc = (nf) => {
    const s = dtOf(nf.startDate, nf.startTime), e = dtOf(nf.endDate, nf.endTime);
    if (e > s) nf.hours = ((e - s) / 3600000).toFixed(1).replace(/\.0$/, "");
    return nf;
  };
  const set = (k, v) => setF((prev) => {
    const nf = { ...prev, [k]: v };
    return ["startDate", "startTime", "endDate", "endTime"].includes(k) ? recalc(nf) : nf;
  });
  const addFiles = (fileList) =>
    setF((prev) => ({ ...prev, attachments: [...prev.attachments, ...Array.from(fileList)] }));

  const submit = async () => {
    if (!f.typeId || !f.reason.trim() || !f.startDate || !f.startTime || !f.endDate || !f.endTime) {
      setErr("假別、事由、起訖日期與時間皆為必填"); return;
    }
    if (dtOf(f.endDate, f.endTime) <= dtOf(f.startDate, f.startTime)) {
      setErr("結束時間不得早於開始時間"); return;
    }
    const clash = mine.some((l) => ["pending", "approved"].includes(l.status) && leaveOverlap(l, f));
    if (clash) { setErr("請假期間與已提出或已批准的請假重疊"); return; }
    setBusy(true);
    await onApply({ ...f, hours: Number(f.hours) || 0 });
    setBusy(false);
    setOpen(false); setF(empty); setErr("");
  };

  return (
    <div className="card p-6">
      <div className="flex items-center justify-between mb-4">
        <h2 className="f-serif text-lg font-semibold">請假申請</h2>
        <button className="btn btn-ink" onClick={() => { setF(empty); setErr(""); setOpen(true); }}>新增請假申請</button>
      </div>
      <div className="space-y-3">
        {mine.length === 0 && <div className="text-sm" style={{ color: "#B3ADA4" }}>尚無請假紀錄。</div>}
        {mine.map((l) => (
          <div key={l.id} className="border hair rounded-lg p-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-2 text-sm">
                <span className="font-medium">{tName(l.typeId)}</span>
                <span>{l.startDate} {l.startTime} ～ {l.endDate} {l.endTime}</span>
                <span className="text-xs" style={{ color: "#8B857C" }}>{l.hours} 小時</span>
                <LvTag s={l.status} />
              </div>
              <div className="flex items-center gap-3">
                {["pending", "approved"].includes(l.status) && (
                  <label className="text-xs underline cursor-pointer" style={{ color: "#8B857C" }}>
                    上傳證明文件
                    <input type="file" multiple accept="image/*,.pdf" className="hidden"
                      onChange={(e) => { onAddAttachment(l.id, Array.from(e.target.files)); e.target.value = ""; }} />
                  </label>
                )}
                {l.status === "pending" && (
                  <button className="text-xs underline" style={{ color: "#7A1515" }} onClick={() => onWithdraw(l)}>撤回申請</button>
                )}
              </div>
            </div>
            <div className="dline mt-2">
              <div><b>事由</b>　{l.reason}{l.note && `　備註：${l.note}`}</div>
              {l.attachments?.length > 0 && (
                <div className="flex flex-wrap items-center gap-2 mt-1">
                  <b>證明文件</b>
                  {l.attachments.map((a, i) => <AttachmentThumb key={i} att={a} />)}
                </div>
              )}
              <div style={{ color: "#B3ADA4" }}>申請時間 {l.appliedAt}</div>
              {l.status === "approved" && (
                <div><b>核准管理員</b>　{l.approvedBy?.name}（{l.approvedBy?.email}）　{l.approvedAt}
                  {l.approvalNote && `　審核備註：${l.approvalNote}`}</div>
              )}
              {l.status === "rejected" && (
                <div className="brick"><b className="brick">駁回</b>　{l.rejectedBy?.name}（{l.rejectedBy?.email}）　{l.rejectedAt}　原因：{l.rejectionReason}</div>
              )}
              {l.status === "withdrawn" && <div style={{ color: "#8B857C" }}>已於 {l.withdrawnAt} 撤回</div>}
            </div>
          </div>
        ))}
      </div>
      <div className="text-xs mt-4" style={{ color: "#B3ADA4" }}>
        送出後不可直接修改申請內容；管理員審核前可撤回後重新提出。待審核與已核准的請假均可補上傳證明文件。經批准的請假將顯示於全員出勤總覽與行事曆（其他同仁僅能看到假別與時段）；待審核申請不會出現在公開畫面。請假事由與證明文件僅限本人與管理員查看。
      </div>

      {open && (
        <Modal title="新增請假申請" onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>假別 *</label>
              <select className="inp mt-1" value={f.typeId} onChange={(e) => set("typeId", e.target.value)}>
                {activeTypes.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>請假事由 *（僅本人與管理員可見）</label>
              <input className="inp mt-1" value={f.reason} onChange={(e) => set("reason", e.target.value)} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs" style={{ color: "#8B857C" }}>開始日期 *</label>
                <input className="inp mt-1" type="date" value={f.startDate} onChange={(e) => set("startDate", e.target.value)} />
              </div>
              <div>
                <label className="text-xs" style={{ color: "#8B857C" }}>開始時間 *</label>
                <input className="inp mt-1" type="time" value={f.startTime} onChange={(e) => set("startTime", e.target.value)} />
              </div>
              <div>
                <label className="text-xs" style={{ color: "#8B857C" }}>結束日期 *</label>
                <input className="inp mt-1" type="date" value={f.endDate} onChange={(e) => set("endDate", e.target.value)} />
              </div>
              <div>
                <label className="text-xs" style={{ color: "#8B857C" }}>結束時間 *</label>
                <input className="inp mt-1" type="time" value={f.endTime} onChange={(e) => set("endTime", e.target.value)} />
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs" style={{ color: "#8B857C" }}>請假時數（自動計算，可調整）</label>
                <input className="inp mt-1" value={f.hours} onChange={(e) => set("hours", e.target.value)} />
              </div>
              <div>
                <label className="text-xs" style={{ color: "#8B857C" }}>備註</label>
                <input className="inp mt-1" value={f.note} onChange={(e) => set("note", e.target.value)} />
              </div>
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>證明文件（選填，可多檔：病假證明、婚喪喜慶證明等）</label>
              <input className="inp mt-1" type="file" multiple accept="image/*,.pdf"
                onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
              {f.attachments.length > 0 && (
                <div className="mt-2 space-y-1">
                  {f.attachments.map((a, i) => (
                    <div key={i} className="flex items-center justify-between text-xs border hair rounded-lg px-3 py-2">
                      <span>{a.name}（{Math.max(1, Math.round(a.size / 1024))} KB）</span>
                      <button className="underline" style={{ color: "#7A1515" }}
                        onClick={() => setF((prev) => ({ ...prev, attachments: prev.attachments.filter((_, j) => j !== i) }))}>移除</button>
                    </div>
                  ))}
                </div>
              )}
              <div className="text-xs mt-1" style={{ color: "#B3ADA4" }}>證明文件僅本人與管理員可查看。</div>
            </div>
            {err && <div className="text-sm brick">{err}</div>}
            <button className="btn btn-ink w-full" disabled={busy} onClick={submit}>{busy ? "送出中…" : "送出申請"}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- 我的出勤（逐段明細） ---------- */
function MyAttendance({ me, records, outings, onCorrection, onChangePw }) {
  const mine = records.filter((r) => r.userId === me.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 21);
  const [corr, setCorr] = useState(null);
  const [segIdx, setSegIdx] = useState(0);
  const [field, setField] = useState("out");
  const [val, setVal] = useState("");
  const [reason, setReason] = useState("");
  const [pwOpen, setPwOpen] = useState(false);
  const [npw, setNpw] = useState("");
  return (
    <div className="card p-6">
      <div className="flex items-center justify-between mb-4">
        <h2 className="f-serif text-lg font-semibold">我的出勤紀錄</h2>
        <button className="btn btn-line" onClick={() => setPwOpen(true)}>修改密碼</button>
      </div>
      <div className="space-y-3">
        {mine.map((r) => {
          const os = outings.filter((o) => o.userId === me.id && o.date === r.date);
          const st = deriveStatus(r, os, [], r.date);
          return (
            <div key={r.id} className="border hair rounded-lg p-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-sm font-medium">{r.date}</span>
                  <span className="text-xs" style={{ color: "#B3ADA4" }}>（{weekdayNames[new Date(r.date).getDay()]}）</span>
                  <StatusTag st={st} />
                  {r.modified && <span className="tag t-mod">已異動</span>}
                  {r.sessions.length > 0 && <span className="text-xs" style={{ color: "#8B857C" }}>合計 {sessionHours(r.sessions)} 小時</span>}
                </div>
                {r.sessions.length > 0 && (
                  <button className="text-xs underline" style={{ color: "#8B857C" }}
                    onClick={() => { setCorr(r); setSegIdx(0); setField("out"); setVal(""); setReason(""); }}>
                    申請更正
                  </button>
                )}
              </div>
              <div className="dline mt-2">
                {r.sessions.map((s, i) => (
                  <div key={`s${i}`} className={i > 0 ? "mt-1" : ""}>
                    <b>第 {i + 1} 段</b>　上班打卡 {s.in}　{s.out ? `下班打卡 ${s.out}` : "（尚未下班）"}
                    {s.in && s.out && <span style={{ color: "#B3ADA4" }}>　{((mins(s.out) - mins(s.in)) / 60).toFixed(1)}h</span>}
                  </div>
                ))}
                {os.map((o, i) => (
                  <div key={`o${i}`} className="mt-1">
                    <Tag k={OUTING_CATS[o.category]?.tagKey ?? "seg"}>{OUTING_CATS[o.category]?.label ?? "外出"}</Tag>　{o.start} 出發
                    {o.expectedEnd && `　預計 ${o.expectedEnd}`}
                    {o.end ? `　實際 ${o.end} 返回（${o.returnAddress ?? "—"}）` : "　（外出中）"}
                    　{o.destination} · {o.purpose}
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <div className="text-xs mt-4" style={{ color: "#B3ADA4" }}>
        原始打卡時間不可自行修改。如有錯漏，請提出更正申請，由管理員審核後補登，並保留完整異動紀錄。
      </div>
      {corr && (
        <Modal title={`更正申請 · ${corr.date}`} onClose={() => setCorr(null)}>
          <div className="space-y-3">
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>更正段次</label>
              <select className="inp mt-1" value={segIdx} onChange={(e) => setSegIdx(Number(e.target.value))}>
                {corr.sessions.map((s, i) => (
                  <option key={i} value={i}>第 {i + 1} 段（{s.in}–{s.out ?? "…"}）</option>
                ))}
              </select>
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>更正欄位</label>
              <select className="inp mt-1" value={field} onChange={(e) => setField(e.target.value)}>
                <option value="in">上班時間</option>
                <option value="out">下班時間</option>
              </select>
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>正確時間（HH:MM）</label>
              <input className="inp mt-1" value={val} onChange={(e) => setVal(e.target.value)} placeholder="18:00" />
            </div>
            <div>
              <label className="text-xs" style={{ color: "#8B857C" }}>申請原因</label>
              <input className="inp mt-1" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="例：系統斷線未成功打卡" />
            </div>
            <button className="btn btn-ink w-full" disabled={!/^\d{2}:\d{2}$/.test(val) || !reason}
              onClick={() => { onCorrection(corr, segIdx, field, val, reason); setCorr(null); }}>
              送出申請
            </button>
          </div>
        </Modal>
      )}
      {pwOpen && (
        <Modal title="修改密碼" onClose={() => setPwOpen(false)}>
          <div className="space-y-3">
            <input className="inp" type="password" value={npw} onChange={(e) => setNpw(e.target.value)} placeholder="新密碼（至少 6 碼）" />
            <button className="btn btn-ink w-full" disabled={npw.length < 6}
              onClick={() => { onChangePw(npw); setNpw(""); setPwOpen(false); }}>確認修改</button>
          </div>
        </Modal>
      )}
    </div>
  );
}
